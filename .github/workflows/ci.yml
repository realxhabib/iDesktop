name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q idesktop tools
      - name: Viewer JavaScript syntax
        run: python tools/check_viewer_js.py
      - name: Installer scripts parse
        shell: pwsh
        run: |
          foreach ($f in 'install.ps1', 'uninstall.ps1', 'extras/install-wda.ps1') {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Error "$f: $_" }; exit 1 }
          }
      - name: End-to-end (mock WebDriverAgent, Tk viewer)
        run: python tools/e2e_test.py
