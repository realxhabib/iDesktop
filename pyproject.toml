[project]
name = "idesktop"
version = "0.1.0"
description = "Mirror and fully control an iPhone from a Windows PC - HD video, touch, keyboard and sound, over USB or Wi-Fi."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "pymobiledevice3==11.26.0",
    "av>=14",
    "pillow>=10",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["websocket-client>=1.8"]

[project.gui-scripts]
idesktop = "idesktop.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["idesktop"]
